<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background-color: #040816;">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e09d5c" />
      <stop offset="100%" stop-color="#8c521b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(300, 210)" filter="url(#glow)">
    <!-- Outer concentric glowing validation lines -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2563eb" stroke-opacity="0.1" stroke-width="2" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-dasharray="10 5" stroke-width="1.5" />
    
    <!-- Outer solid circle -->
    <circle cx="0" cy="0" r="65" fill="#0b1329" stroke="url(#bronzeGrad)" stroke-width="4.5" />
    
    <!-- Verification Checkmark -->
    <path d="M -22,2 L -7,17 L 22,-18" fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" />
  </g>

  <!-- Node Hash/Data text -->
  <text x="300" y="360" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#e09d5c" text-anchor="middle" letter-spacing="1">TX SIGNATURE APPROVED</text>
  <text x="300" y="385" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">BLOCK CONFIRMED #489,190 • SECURE CONFLICT ZERO</text>
</svg>
