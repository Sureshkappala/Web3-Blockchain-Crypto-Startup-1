<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background-color: #040816;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="300" y="50" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OPTIMIZED STAKING MIX</text>

  <!-- Concentric Donut Chart rings -->
  <g transform="translate(300, 230)" filter="url(#glow)">
    <!-- Outer Ring (L1 Staking Tokens - ETH/SOL) -->
    <circle r="120" fill="none" stroke="#2563eb" stroke-width="12" stroke-dasharray="753" stroke-dashoffset="180" />
    
    <!-- Middle Ring (Stablecoin Yields - USDC/USDT) -->
    <circle r="95" fill="none" stroke="#c27d38" stroke-width="12" stroke-dasharray="596" stroke-dashoffset="200" />
    
    <!-- Inner Ring (DAO Ventures / DeFi Arbitrage Pools) -->
    <circle r="70" fill="none" stroke="#60a5fa" stroke-width="12" stroke-dasharray="439" stroke-dashoffset="120" />
    
    <!-- Central Core -->
    <circle r="45" fill="#0b1329" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#e09d5c" text-anchor="middle">BLOCKNEX</text>
  </g>

  <!-- Legend Labels -->
  <g transform="translate(80, 395)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#2563eb" />
    <text x="20" y="10" fill="#94a3b8">L1 Staking (45%)</text>
  </g>

  <g transform="translate(240, 395)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#c27d38" />
    <text x="20" y="10" fill="#94a3b8">Stablecoin Yield (35%)</text>
  </g>

  <g transform="translate(420, 395)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#60a5fa" />
    <text x="20" y="10" fill="#94a3b8">DeFi Pools (20%)</text>
  </g>
</svg>
