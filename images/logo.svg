<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Metallic Copper Gradient -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e09d5c" />
      <stop offset="50%" stop-color="#c27d38" />
      <stop offset="100%" stop-color="#8c521b" />
    </linearGradient>
    <!-- Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Icon: Futuristic Isometric Cube with interconnecting nodes -->
  <g transform="translate(50, 50)">
    <!-- Outer Hexagon Outline -->
    <polygon points="0,-42 36.37,-21 36.37,21 0,42 -36.37,21 -36.37,-21" fill="none" stroke="url(#blueGrad)" stroke-width="2.5" stroke-opacity="0.4" />
    
    <!-- Isometric Top Face -->
    <polygon points="0,0 27.7,-16 0,-32 -27.7,-16" fill="url(#blueGrad)" fill-opacity="0.15" stroke="url(#blueGrad)" stroke-width="1.5" />
    
    <!-- Isometric Left Face -->
    <polygon points="0,0 -27.7,-16 -27.7,16 0,32" fill="url(#copperGrad)" fill-opacity="0.1" stroke="url(#copperGrad)" stroke-width="1.5" />
    
    <!-- Isometric Right Face -->
    <polygon points="0,0 27.7,-16 27.7,16 0,32" fill="url(#blueGrad)" fill-opacity="0.05" stroke="url(#blueGrad)" stroke-width="1.5" />
    
    <!-- Cyber core node -->
    <circle cx="0" cy="0" r="6" fill="url(#copperGrad)" filter="url(#neonGlow)" />
    
    <!-- Interconnecting orbit paths -->
    <circle cx="0" cy="-32" r="3" fill="#60a5fa" filter="url(#neonGlow)" />
    <circle cx="27.7" cy="16" r="3" fill="#60a5fa" filter="url(#neonGlow)" />
    <circle cx="-27.7" cy="16" r="3" fill="#e09d5c" filter="url(#neonGlow)" />
    
    <!-- Connecting rays -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="url(#copperGrad)" stroke-width="1.5" />
    <line x1="0" y1="0" x2="27.7" y2="16" stroke="url(#blueGrad)" stroke-width="1.5" />
    <line x1="0" y1="0" x2="-27.7" y2="16" stroke="url(#copperGrad)" stroke-width="1.5" />
  </g>
</svg>
