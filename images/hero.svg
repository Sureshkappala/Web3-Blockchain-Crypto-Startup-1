<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #050a18;">
  <defs>
    <!-- Background Grid -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2563eb" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#e09d5c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c27d38" />
      <stop offset="100%" stop-color="#e09d5c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)" />

  <!-- Core Circuit Line Decor -->
  <path d="M 50,225 L 150,225 L 200,125 L 300,125 L 350,325 L 500,325 L 550,200 L 750,200" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />

  <!-- Main Yield Curve Chart (DeFi Staking Trend) -->
  <path d="M 100,350 C 180,310 220,180 300,190 C 380,200 420,100 500,130 C 580,160 620,80 700,70 L 700,350 Z" fill="url(#areaGrad)" />
  <path d="M 100,350 C 180,310 220,180 300,190 C 380,200 420,100 500,130 C 580,160 620,80 700,70" fill="none" stroke="url(#strokeGrad)" stroke-width="4.5" filter="url(#glow)" />

  <!-- Data point indicators -->
  <circle cx="300" cy="190" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <circle cx="500" cy="130" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <circle cx="700" cy="70" r="7" fill="#e09d5c" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)" />

  <!-- Text and Labels -->
  <text x="100" y="380" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">Q1 START</text>
  <text x="300" y="380" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">DEFI LAUNCH</text>
  <text x="500" y="380" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">V2 UPGRADE</text>
  <text x="700" y="380" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">CURRENT YIELD</text>

  <!-- Interactive Floating Elements -->
  <!-- Target APY Banner -->
  <g transform="translate(120, 80)" filter="url(#glow)">
    <rect width="180" height="70" rx="10" fill="#0b1329" fill-opacity="0.9" stroke="url(#strokeGrad)" stroke-width="1.5" />
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" font-weight="700" letter-spacing="0.5">NET NODE APY</text>
    <text x="20" y="52" font-family="'Outfit', sans-serif" font-size="22" fill="#e09d5c" font-weight="800">+24.85%</text>
  </g>

  <!-- Block Validation Speed -->
  <g transform="translate(480, 220)" filter="url(#glow)">
    <rect width="180" height="70" rx="10" fill="#0b1329" fill-opacity="0.9" stroke="url(#strokeGrad)" stroke-width="1.5" />
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" font-weight="700" letter-spacing="0.5">VALIDATION RATE</text>
    <text x="20" y="52" font-family="'Outfit', sans-serif" font-size="22" fill="#60a5fa" font-weight="800">99.98% OK</text>
  </g>
</svg>
