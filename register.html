<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Stackly Web3 Staking</title>
  <meta name="description" content="Create your Stackly Web3 Staking account.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-brand">
        <a href="index.html" class="logo">
          <img src="images/logo_gold.webp" alt="Stackly Logo" class="logo-img">
          <span class="logo-text">Stack<span>ly</span></span>
        </a>
      </div>
      <div class="auth-image">
        <img src="images/auth-bg.webp" alt="Architecture">
        <div class="auth-overlay"></div>
        <div class="auth-quote">
          <p>"Form follows function - that has been misunderstood. Form and function should be one."</p>
          <span>— Frank Lloyd Wright</span>
        </div>
      </div>
    </div>
    
    <div class="auth-right">
      <div class="auth-form-wrapper">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Stackly Web3 Staking today</p>
        
        <form id="register-form" class="auth-form">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <div class="input-with-icon">
                <i class="fas fa-user"></i>
                <input type="text" class="form-input" placeholder="John" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <div class="input-with-icon">
                <i class="fas fa-user"></i>
                <input type="text" class="form-input" placeholder="Doe" required>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-with-icon">
              <i class="fas fa-envelope"></i>
              <input type="email" class="form-input" placeholder="john@example.com" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <div class="input-with-icon">
              <i class="fas fa-phone"></i>
              <input type="tel" class="form-input" placeholder="+1 (234) 567-890">
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" class="form-input" placeholder="Create a password" required>
              <button type="button" class="toggle-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <div class="input-with-icon">
              <i class="fas fa-lock"></i>
              <input type="password" class="form-input" placeholder="Confirm your password" required>
            </div>
          </div>
          
          <div class="form-group">
            <label class="terms-checkbox">
              <input type="checkbox" required>
              <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
            </label>
          </div>
          
          <button type="submit" class="btn btn-gold btn-lg w-full">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>
        
        <div class="auth-divider">
          <span>Or sign up with</span>
        </div>
        
        <div class="social-login">
         <a href="404.html" class="social-btn google">
            <i class="fab fa-google"></i> Google
          </a>
          <a href="404.html" class="social-btn linkedin">
            <i class="fab fa-linkedin-in"></i> LinkedIn
          </a>
        </div>
        
        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.querySelector('.toggle-password').addEventListener('click', function() {
      const input = this.parentElement.querySelector('input');
      const icon = this.querySelector('i');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });
    
    // Form submission
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Account created successfully! Welcome to Stackly Web3 Staking.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
